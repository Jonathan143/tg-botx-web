name: Stage reviewed frontend changes

on:
  pull_request:
    paths:
      - .github/workflows/feature-stage.yml

permissions:
  contents: write

concurrency:
  group: stage-reviewed-frontend
  cancel-in-progress: false

jobs:
  stage:
    if: github.head_ref == 'feat/random-runs-message-library' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Apply reviewed changes and verify exact content
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          for part in ('core', 'page', 'tasks'):
              patch = pathlib.Path(f'feature-stage-{part}.patch').read_text().replace('\n diff --git ', '\ndiff --git ')
              target = pathlib.Path(f'/tmp/reviewed-{part}.patch')
              target.write_text(patch)
              subprocess.run(['git', 'apply', '--check', str(target)], check=True)
              subprocess.run(['git', 'apply', str(target)], check=True)
          expected = {
            'README.md': '77ca1799632a4ea0f076511c496b8e1e21835f69ca003ee7105fe43a6b8bd289',
            'src/App.tsx': '57f8fcd290c7d8e5303cfd74af76e0d26fdae45613130af05befd73c84da50b9',
            'src/components/message-list-editor.tsx': '0fcc21d48c2118e71071907bf5c5510bcf8c6327f7ae50498a07b3856793dbac',
            'src/components/app-shell.tsx': '0e1e4a126ae568ced622fbfcfc27b6a17fab9505463f2a03f2fd134d79c8eb33',
            'src/lib/message-library.ts': '327f5249cf6dd1f9be73923f7c0d4babdb9e39ae198a401e3b9706ff8d63ee24',
            'src/lib/workflow-condition.ts': 'a86f283d78f38d1a1e66be0340e41d78b0adff4fea233ba60911cad8355192a3',
            'src/lib/api/message-library.ts': 'bbb178bc6ddff67cdae44b8e53d7e11ebac631ae7d5a3f9c98743cc13ca1487b',
            'src/lib/api/types.ts': 'eb11a89f2353541661dfa5320b10858f7bac01f73d197d3fad1c4f2ff12508d1',
            'src/pages/message-library/index.tsx': '2aaf7e1e01af5e4892d0f4bbd4aa961c76c6e727c20d6b33e3def9ce0299c050',
            'src/pages/tasks/schedule-validation.ts': 'd98a011e048ede9dedc344f66eb6f0fe42f22790028553cf572515d4558f3a0c',
            'src/pages/tasks/components/send-message-fields.tsx': '5f383d4e2ce85009e3bf34b2a156146d9fbcdebe284d4bac3d6999738ab34ec1',
            'src/pages/tasks/components/task-form.tsx': '3987bb880df6cd16189bda866560a66de701f181d6e4ca1df7177bc55191b6a4',
            'src/pages/tasks/components/task-workflow-editor.tsx': '66d5111ef5ca276c88db9e6f8fa89667eed92eca98702d7bcdfafc4f1ef0778b',
            'src/pages/message-library/components/group-list.tsx': '4e6031ecd88ce3282b86ac9dc6e0952acc501327b550db50575f302d9319fa5c',
            'src/pages/message-library/components/group-editor-dialog.tsx': 'a6437b0a3f5c33067b6b4bf3e267ec2c8b7a4bfdb28b8a9a35c5b896e75a3936',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Commit reviewed stages to this feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/message-library.ts src/lib/api/message-library.ts src/components/message-list-editor.tsx
          git commit -m 'feat(messages): 增加消息契约校验和共享列表编辑器'
          git add src/pages/message-library src/App.tsx src/components/app-shell.tsx
          git commit -m 'feat(messages): 增加分组消息库管理页面'
          git add src/lib/api/types.ts src/lib/workflow-condition.ts src/pages/tasks
          git commit -m 'feat(tasks): 支持随机执行次数与快照实时随机消息配置'
          git add README.md
          git commit -m 'docs: 说明消息来源差异与双端上线顺序'
          git push origin HEAD:refs/heads/feat/random-runs-message-library
